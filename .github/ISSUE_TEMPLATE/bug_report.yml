name: Bug report
description: Report a reproducible problem in Plainsay
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach private dictation text, audio, API keys, or account tokens.
  - type: input
    id: version
    attributes:
      label: Plainsay version
      description: Open Settings › General and copy the version shown there.
      placeholder: Shown in Settings › General
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Transcription mode
      options:
        - Local — Whisper
        - Local — Parakeet
        - Plainsay Cloud
        - My own speech API
        - Not sure / not applicable
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac and macOS
      placeholder: MacBook Air M3, macOS 15.6
    validations:
      required: true
  - type: input
    id: target_app
    attributes:
      label: App where you were dictating
      placeholder: Notes, Terminal, Chrome, Slack…
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Hold …
        3. Say …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful. Remove private text and secrets first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private dictation content, recordings, and credentials.
          required: true
