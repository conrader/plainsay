name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only a PR's obsolete runs share a group. Main pushes each keep their run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # The unit suite needs no microphone, no model download, and no network —
    # everything that would need those is behind PLAINSAY_INTEGRATION.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
